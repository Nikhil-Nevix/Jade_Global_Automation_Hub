# InfraAnsible Merged app — nginx site config
# Dedicated port 9393 so it never collides with the existing apps (9191 / 9292).
# Frontend is built with base "/" and BrowserRouter basename "/".

server {
    listen 9393;
    server_name _;

    # React SPA (built assets)
    root /home/svc-ansible/apps/InfraAnsible_VM/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Socket.IO (real-time job logs + interactive patches) — proxied to the FastAPI ASGI app
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
