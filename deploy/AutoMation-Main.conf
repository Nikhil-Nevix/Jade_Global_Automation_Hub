server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/jadeinfrahub.crt;
    ssl_certificate_key /etc/ssl/jadeinfrahub.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_ecdh_curve X25519:secp384r1;
    ssl_conf_command Options PrioritizeChaCha;

    client_max_body_size 50M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    server_tokens off;

#Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    #################################################################
    # AutoHub
    #################################################################

    if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS|HEAD)$ ) {
    return 405;
	}

#CSP
	add_header Content-Security-Policy "
	default-src 'self';
	base-uri 'self';
	object-src 'none';
	frame-ancestors 'self';
	img-src 'self' data: https:;
	font-src 'self' data:;
	style-src 'self' 'unsafe-inline';
	script-src 'self' 'unsafe-inline' 'unsafe-eval';
	connect-src 'self' https: wss:;
	form-action 'self';
	upgrade-insecure-requests;
	" always;


    location = /autohub {
        return 301 /autohub/;
    }

    location /autohub/ {
        rewrite ^/autohub/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:9191;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    #################################################################
    # AutoHub Backend APIs
    #################################################################

    location /api/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #################################################################
    # AutoHub Socket.IO
    #################################################################

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400;
    }

    #################################################################
    # Jade-NEXUS
    #################################################################

    location = /jadenexus {
        return 301 /jadenexus/;
    }

    location /jadenexus/ {
        alias /home/svc-ansible/apps/Jade-NEXUS/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /jadenexus/index.html;
    }

    location /jadenexus/api/ {
        rewrite ^/jadenexus/api/(.*) /api/$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jadenexus;
    }

    location /jadenexus/auth/ {
        rewrite ^/jadenexus/auth/(.*) /auth/$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jadenexus;
    }

    location /jadenexus/ws {
        rewrite ^/jadenexus/ws(.*) /ws$1 break;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    #################################################################
    # InfraAnsible Vulnerability (dev — Vite on 127.0.0.1:5173)
    #################################################################

    location = /vulnhub {
        return 301 /vulnhub/;
    }

    location /vulnhub/ {
        proxy_pass http://127.0.0.1:5173/vulnhub/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /vulnhub/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /vulnhub/socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    #################################################################
    # Future Applications
    #################################################################

