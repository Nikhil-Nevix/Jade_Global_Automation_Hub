# InfraAnsible Vulnerability Update — nginx site config
# Served on a dedicated port so it never collides with the existing app (9191).
# Frontend is built with base "/autohub/" and BrowserRouter basename "/autohub".

server {
    listen 9292;
    server_name _;

    # React SPA (built assets)
    root /home/svc-ansible/apps/InfraAnsible_Vulnerability/frontend/dist;
    index index.html;

    # Serve the SPA under /autohub
    location /autohub/ {
        alias /home/svc-ansible/apps/InfraAnsible_Vulnerability/frontend/dist/;
        try_files $uri $uri/ /autohub/index.html;
    }

    location = / {
        return 302 /autohub/;
    }

    # FastAPI REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Socket.IO (real-time job logs) — proxied to the FastAPI ASGI app
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Optional: reverse-proxy Apache Superset for same-origin embedding.
    # The embedded SDK loads the dashboard from SUPERSET_URL; if you want it
    # served same-origin, point SUPERSET_URL at http://<host>:9292/superset
    # and uncomment the block below.
    # location /superset/ {
    #     proxy_pass http://127.0.0.1:8088/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}
