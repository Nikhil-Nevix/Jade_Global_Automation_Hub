---
# Interactive Patch Installation Playbook
# This playbook demonstrates the interactive playbook system
# It scans for available patches, sends them to the user for selection,
# and installs only the selected patches

- name: Interactive Patch Installation
  hosts: all
  gather_facts: yes
  vars:
    wait_timeout_seconds: 30  # 1 hour timeout for user response
    job_id: ""  # Will be provided by the system
    backend_url: ""  # Will be provided by the system
  
  tasks:
    - name: Check for available patches (Debian/Ubuntu)
      shell: apt list --upgradable 2>/dev/null | grep -v "Listing..." | awk -F/ '{print $1}'
      register: available_patches_debian
      when: ansible_os_family == "Debian"
      changed_when: false
      ignore_errors: yes
    
    - name: Check for available patches (RedHat/CentOS)
      shell: yum list updates | tail -n +2 | awk '{print $1}'
      register: available_patches_redhat
      when: ansible_os_family == "RedHat"
      changed_when: false
      ignore_errors: yes
    
    - name: Set patches fact
      set_fact:
        patches_list: "{{ available_patches_debian.stdout_lines if ansible_os_family == 'Debian' else available_patches_redhat.stdout_lines }}"
    
    - name: Display available patches count
      debug:
        msg: "Found {{ patches_list | length }} available patches"
    
    - name: Fail if no patches available
      fail:
        msg: "No patches available for installation"
      when: patches_list | length == 0
    
    - name: Write available patches to file
      copy:
        content: "{{ patches_list | join('\n') }}"
        dest: "/tmp/available_patches_{{ job_id }}.txt"
      when: patches_list | length > 0
    
    - name: Notify backend that patches are ready
      uri:
        url: "{{ backend_url }}/api/jobs/{{ job_id }}/patches-ready"
        method: POST
        body_format: json
        body:
          file_path: "/tmp/available_patches_{{ job_id }}.txt"
        headers:
          Content-Type: "application/json"
        status_code: 200
      delegate_to: localhost
      register: notification_result
    
    - name: Wait for user to select patches
      wait_for:
        path: "/tmp/selected_patches_{{ job_id }}.txt"
        timeout: "{{ wait_timeout_seconds }}"
      register: wait_result
    
    - name: Read selected patches
      slurp:
        src: "/tmp/selected_patches_{{ job_id }}.txt"
      register: selected_patches_file
    
    - name: Parse selected patches
      set_fact:
        selected_patches: "{{ (selected_patches_file.content | b64decode).split('\n') | select('match', '^.+$') | list }}"
    
    - name: Display selected patches
      debug:
        msg: "Installing {{ selected_patches | length }} selected patches"
    
    - name: Install selected patches (Debian/Ubuntu)
      apt:
        name: "{{ selected_patches }}"
        state: latest
        update_cache: yes
      when: 
        - ansible_os_family == "Debian"
        - selected_patches | length > 0
      become: yes
    
    - name: Install selected patches (RedHat/CentOS)
      yum:
        name: "{{ selected_patches }}"
        state: latest
      when: 
        - ansible_os_family == "RedHat"
        - selected_patches | length > 0
      become: yes
      register: install_result
    
    - name: Get new versions of selected packages (Debian/Ubuntu)
      shell: |
        for pkg in {{ selected_patches | join(' ') }}; do
          version=$(dpkg-query -W -f='${Version}' $pkg 2>/dev/null || echo "not-installed")
          echo "$pkg|$version"
        done
      register: new_versions_debian
      when: 
        - ansible_os_family == "Debian"
        - selected_patches | length > 0
      changed_when: false
    
    - name: Get new versions of selected packages (RedHat/CentOS)
      shell: |
        for pkg in {{ selected_patches | join(' ') }}; do
          version=$(rpm -q $pkg --queryformat '%{VERSION}-%{RELEASE}' 2>/dev/null || echo "not-installed")
          echo "$pkg|$version"
        done
      register: new_versions_rhel
      when: 
        - ansible_os_family == "RedHat"
        - selected_patches | length > 0
      changed_when: false
    
    - name: Parse new versions
      set_fact:
        new_versions_dict: >-
          {%- set versions = {} -%}
          {%- if ansible_os_family == "RedHat" and new_versions_rhel is defined -%}
            {%- for line in new_versions_rhel.stdout_lines -%}
              {%- set parts = line.split('|') -%}
              {%- if parts | length == 2 -%}
                {%- set _ = versions.update({parts[0]: parts[1]}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- elif ansible_os_family == "Debian" and new_versions_debian is defined -%}
            {%- for line in new_versions_debian.stdout_lines -%}
              {%- set parts = line.split('|') -%}
              {%- if parts | length == 2 -%}
                {%- set _ = versions.update({parts[0]: parts[1]}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ versions }}
      when: selected_patches | length > 0
    
    - name: Build patch report rows
      set_fact:
        patch_report_rows: >-
          [
          {% for pkg in selected_patches %}
          "{{ pkg }},unknown,{{ new_versions_dict.get(pkg, 'unknown') }},Installed"{{ "," if not loop.last else "" }}
          {% endfor %}
          ]
      when: selected_patches | length > 0
    
    - name: Generate patch report CSV
      set_fact:
        patch_report_csv: "Package,Old Version,New Version,Status\n{{ patch_report_rows | from_json | join('\n') }}"
      when: selected_patches | length > 0
    
    - name: Send patch report to backend
      uri:
        url: "{{ backend_url }}/api/jobs/{{ job_id }}/patch-report"
        method: POST
        body_format: json
        body:
          csv_data: "{{ patch_report_csv }}"
        headers:
          Content-Type: "application/json"
        status_code: 200
        timeout: 30
      delegate_to: localhost
      when: selected_patches | length > 0
      register: report_result
      ignore_errors: true
    
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/available_patches_{{ job_id }}.txt"
        - "/tmp/selected_patches_{{ job_id }}.txt"
      ignore_errors: yes
    
    - name: Installation complete
      debug:
        msg: "Successfully installed {{ selected_patches | length }} patches"
